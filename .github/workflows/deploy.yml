name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily, so the "outline checked" date in the app stays current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build reads git history for the "last updated" date

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare the live study guide with the snapshot
        run: node scripts/check-exam.mjs --out build/exam-status.json

      - name: Validate the content and build the page
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

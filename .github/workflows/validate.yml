name: Validate

on:
  pull_request:
    paths:
      - "content/**"
      - "src/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate every question and build the page
        run: node scripts/build.mjs

      - name: Check question wording against the exam outline's vocabulary
        run: node scripts/era-check.mjs

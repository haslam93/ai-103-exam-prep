name: Exam watch

# Compares the official AI-103 study guide with content/exam-snapshot.json every day.
# When Microsoft changes the outline, this opens an issue that lists what was added and removed.

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # the monthly keep-alive commit below
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare the live study guide with the snapshot
        id: check
        run: node scripts/check-exam.mjs --report build/exam-report.md --record .github/outline-check.json

      - name: Open or refresh the tracking issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create exam-update --color B60205 --description "The official AI-103 outline changed" --force
          number=$(gh issue list --label exam-update --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title "The AI-103 study guide changed" --label exam-update --body-file build/exam-report.md
          else
            gh issue edit "$number" --body-file build/exam-report.md
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # check-exam.mjs rewrites this file about once a month; committing it keeps the schedule alive
      # and leaves a record of the checks.
      - name: Commit the monthly check record
        run: |
          if [ -n "$(git status --porcelain .github/outline-check.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/outline-check.json
            git commit -m "chore: record outline check"
            git push
          fi
